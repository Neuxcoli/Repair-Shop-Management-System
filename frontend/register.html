<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Create Account · Repair Shop</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<a href="/" class="btn btn-outline" style="position:absolute;top:24px;left:24px;color:#374151;border-color:#9ca3af;background:#fff;"><i class="bi bi-arrow-left"></i> Back to Home</a>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon"><i class="bi bi-wrench-adjustable-circle-fill"></i></div>
      <div>
        <div class="login-brand-name">Repair Shop</div>
        <div class="login-brand-sub">CUSTOMER PORTAL</div>
      </div>
    </div>

    <h1 class="login-title">Create your account</h1>
    <p class="login-sub">Sign up to submit repair requests and track your orders.</p>

    <form id="register-form" novalidate>
      <div class="field">
        <label for="reg-name">Full Name</label>
        <input class="input" id="reg-name" name="full_name" autocomplete="name" required>
      </div>
      <div class="field">
        <label for="reg-email">Email</label>
        <input class="input" id="reg-email" name="email" type="email" autocomplete="email" placeholder="you@example.com" required>
      </div>
      <div class="field">
        <label for="reg-phone">Phone (optional)</label>
        <input class="input" id="reg-phone" name="phone" autocomplete="tel">
      </div>
      <div class="field">
        <label for="reg-address">Address (optional)</label>
        <input class="input" id="reg-address" name="address" autocomplete="street-address">
      </div>
      <div class="field">
        <label for="reg-password">Password</label>
        <input class="input" id="reg-password" name="password" type="password" autocomplete="new-password" minlength="6" required>
        <div class="cell-sub" style="margin-top:4px;">At least 6 characters.</div>
      </div>
      <div class="field">
        <label for="reg-confirm">Confirm Password</label>
        <input class="input" id="reg-confirm" name="confirm" type="password" autocomplete="new-password" required>
      </div>
      <div class="login-error" id="register-error" hidden></div>
      <button class="btn btn-primary login-btn" id="register-btn" type="submit"><i class="bi bi-person-plus"></i> Create Account</button>
    </form>

    <div class="login-footer">Already have an account? <a href="/login.html">Sign in</a></div>
  </div>
</div>

<script type="module" src="/src/register.js"></script>
</body>
</html>
