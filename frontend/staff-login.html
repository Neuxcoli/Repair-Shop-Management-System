<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Staff Login · Precision Repair</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
</head>
<body class="login-body">

<a href="/" class="btn btn-secondary" style="position:absolute;top:24px;left:24px;"><i class="bi bi-arrow-left"></i> Back to Home</a>

<div class="login-wrap">
  <div class="login-card">
    <div class="login-brand">
      <div class="brand-icon"><i class="bi bi-building"></i></div>
      <div>
        <div class="login-brand-name">Precision Repair</div>
        <div class="login-brand-sub">STAFF ACCESS</div>
      </div>
    </div>

    <h1 class="login-title">Staff Sign In</h1>
    <p class="login-sub">Administrators and technicians — sign in with your workspace credentials.</p>

    <form id="login-form" novalidate>
      <div class="field">
        <label for="login-username">Username or Email</label>
        <input class="input" id="login-username" name="username" autocomplete="username" required>
      </div>
      <div class="field">
        <label for="login-password">Password</label>
        <input class="input" id="login-password" name="password" type="password" autocomplete="current-password" required>
      </div>
      <div class="login-error" id="login-error" hidden></div>
      <button class="btn btn-primary login-btn" id="login-btn" type="submit"><i class="bi bi-box-arrow-in-right"></i> Sign In</button>
    </form>
  </div>
</div>

<script type="module" src="/src/login.js"></script>
</body>
</html>
