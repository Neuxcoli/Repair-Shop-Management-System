[project]
name = "repair-shop-management-system"
version = "1.0.0"
requires-python = "==3.12.*"
dependencies = [
    "fastapi==0.115.0",
    "SQLAlchemy==2.0.35",
    "psycopg2-binary==2.9.9",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "python-dotenv==1.0.1",
    "bcrypt==4.2.1",
    "PyJWT==2.9.0",
    "python-multipart==0.0.32",
    "boto3==1.43.83",
]

[tool.vercel]
entrypoint = "backend.app.main:app"

[tool.vercel.scripts]
build = "npm run build"
